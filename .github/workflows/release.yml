name: Build Windows app and release
on:
  push:
    branches: [main]
    paths: ['AudioRouter.cs', 'Build.bat', 'README.md', 'THIRD-PARTY.txt', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: audio-router-release
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build with Windows .NET Framework
        shell: cmd
        run: call Build.bat --no-pause
      - name: Test core logic
        shell: pwsh
        run: |
          $process = Start-Process dist/AudioRouter.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($process.ExitCode -ne 0 -or !(Test-Path dist/self-test-passed.txt)) { throw 'Core checks failed' }
          Get-Content dist/self-test-passed.txt
          Remove-Item dist/self-test-passed.txt
      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path dist/* -DestinationPath AudioRouter-Windows.zip
          (Get-FileHash AudioRouter-Windows.zip -Algorithm SHA256).Hash.ToLower() + '  AudioRouter-Windows.zip' | Set-Content SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: AudioRouter-Windows
          path: |
            AudioRouter-Windows.zip
            SHA256SUMS.txt
      - name: Publish versioned release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $source = Get-Content AudioRouter.cs -Raw
          $version = [regex]::Match($source, 'public const string Version="([0-9.]+)"').Groups[1].Value
          if (!$version) { throw 'Version not found' }
          $tag = "v$version"
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists. Bump Backend.Version and assembly versions for the next release. Existing releases are never overwritten."
          } else {
            gh release create $tag AudioRouter-Windows.zip SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Audio Router $version" --notes 'Portable Windows app: per-program audio routing, volume, mute, and GitHub update detection. Extract the ZIP and open AudioRouter.exe. Install the free local audio engine on first run.'
            if ($LASTEXITCODE -ne 0) { throw 'Release publish failed' }
          }
